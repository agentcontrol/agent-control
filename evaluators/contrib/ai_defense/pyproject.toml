[project]
name = "agent-control-evaluator-ai-defense"
version = "0.1.0"
description = "Cisco AI Defense Chat Inspection evaluator for Agent Control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-control-evaluators>=3.0.0",
    "agent-control-models>=3.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.entry-points."agent_control.evaluators"]
"ai_defense.chat_inspect" = "agent_control_evaluator_ai_defense.chat_inspect:ChatInspectEvaluator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_evaluator_ai_defense"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
