name: Release

on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.semantic_release.outputs.released }}
      tag: ${{ steps.semantic_release.outputs.tag }}
      contrib_matrix: ${{ steps.contrib_matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GALILEO_AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup UV
        uses: astral-sh/setup-uv@v4

      - name: Verify contrib wiring
        run: python scripts/contrib_packages.py verify

      - name: Compute contrib matrix
        id: contrib_matrix
        run: |
          {
            echo "matrix<<EOF"
            python scripts/contrib_packages.py matrix
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Python Semantic Release
        id: semantic_release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          git_committer_name: galileo-automation
          git_committer_email: ci@rungalileo.io
          github_token: ${{ secrets.GALILEO_AUTOMATION_GITHUB_TOKEN || github.token }}
          ssh_public_signing_key: ${{ secrets.GALILEO_AUTOMATION_SSH_PUBLIC_KEY }}
          ssh_private_signing_key: ${{ secrets.GALILEO_AUTOMATION_SSH_PRIVATE_KEY }}
          root_options: "-vv"

      - name: Build Packages
        if: steps.semantic_release.outputs.released == 'true'
        run: |
          uv sync
          uv run python scripts/build.py all

      - name: Upload built distributions
        if: steps.semantic_release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          if-no-files-found: error
          path: |
            models/dist/*
            evaluators/builtin/dist/*
            sdks/python/dist/*
            server/dist/*
            evaluators/contrib/*/dist/*

  publish-models:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: .

      - name: Publish agent-control-models to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: models/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-evaluators:
    runs-on: ubuntu-latest
    needs: [release, publish-models]
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: .

      - name: Publish agent-control-evaluators to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: evaluators/builtin/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-contrib:
    runs-on: ubuntu-latest
    needs: [release, publish-evaluators]
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        contrib: ${{ fromJSON(needs.release.outputs.contrib_matrix) }}

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: .

      - name: Publish ${{ matrix.contrib.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.contrib.dir }}/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-sdk:
    runs-on: ubuntu-latest
    needs: [release, publish-contrib]
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: .

      - name: Publish agent-control-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: [release, publish-sdk]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: .

      - name: Upload to GitHub Release
        uses: python-semantic-release/upload-to-gh-release@main
        with:
          github_token: ${{ secrets.GALILEO_AUTOMATION_GITHUB_TOKEN || github.token }}
          tag: ${{ needs.release.outputs.tag }}
          root_options: "-vv"
          dist_glob: |
            models/dist/*
            evaluators/builtin/dist/*
            sdks/python/dist/*
            server/dist/*
            evaluators/contrib/*/dist/*
