[project]
name = "agent-control-azure-foundry-langgraph-example"
version = "0.1.0"
description = "Agent Control example: LangGraph agent on Azure AI Foundry with runtime guardrails"
requires-python = ">=3.12"
dependencies = [
    "agent-control-sdk",
    "langgraph>=1.0.10",
    "langchain>=1.2.0",
    "langchain-azure-ai>=1.1.0",
    "langchain-openai>=1.1.0",
    "azure-ai-agentserver-langgraph>=1.0.0b16",
    "azure-identity>=1.23",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
