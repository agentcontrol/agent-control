[project]
name = "langsmith-rag-example"
version = "0.1.0"
description = "RAG Q&A agent with LangSmith evaluator controls"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.21",
    "langchain-community>=0.3.21",
    "langchain-openai>=0.3.21",
    "langgraph>=0.3.21",
    "langsmith>=0.2.4",
    "openai>=1.59.5",
    "faiss-cpu>=1.9.0",
    "tiktoken>=0.8.0",
    "agent-control @ file://../../sdks/python",
    "agent-control-models @ file://../../models",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
agent-control = { path = "../../sdks/python", editable = true }
agent-control-models = { path = "../../models", editable = true }
