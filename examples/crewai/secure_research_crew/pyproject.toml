[project]
name = "agent-control-crewai-research-crew"
version = "0.1.0"
description = "CrewAI multi-agent research crew with per-agent policies via Agent Control"
requires-python = ">=3.12"
dependencies = [
    "agent-control-sdk>=6.3.0",
    "crewai>=1.10.1",
    "crewai-tools>=0.12.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
