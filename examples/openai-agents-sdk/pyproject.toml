[project]
name = "agent-control-openai-agents-example"
version = "0.1.0"
description = "openai-agents SDK example integrated with Agent Control"
requires-python = ">=3.12"
dependencies = [
    "agent-control-engine",
    "agent-control-models",
    "agent-control-plugins",
    "agent-control-sdk",
    "openai-agents>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
]

[tool.uv.sources]
agent-control-sdk = { path = "../../sdks/python", editable = true }
agent-control-models = { path = "../../models", editable = true }
agent-control-engine = { path = "../../engine", editable = true }
agent-control-plugins = { path = "../../plugins", editable = true }
