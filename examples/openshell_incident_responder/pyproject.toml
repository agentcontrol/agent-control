[project]
name = "agent-control-openshell-ci-triage"
version = "0.1.0"
description = "Daily CI triage agent using deepagents, OpenShell, and Agent Control"
requires-python = ">=3.12"
dependencies = [
    "agent-control-engine",
    "agent-control-models",
    "agent-control-evaluators",
    "agent-control-sdk",
    "deepagents",
    "langchain",
    "langchain-openai",
    "openshell",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "*.sh",
    "*.yaml",
    "demo_workspace/**",
]

[tool.uv.sources]
agent-control-sdk = { path = "../../sdks/python", editable = true }
agent-control-models = { path = "../../models", editable = true }
agent-control-engine = { path = "../../engine", editable = true }
agent-control-evaluators = { path = "../../evaluators/builtin", editable = true }
