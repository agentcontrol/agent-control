[project]
name = "agent-control-rule-cisco"
version = "8.1.2"
description = "Cisco AI Defense rule for agent-control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Cisco AI Defense Team" }]
dependencies = [
    "agent-control-rules>=7.5.0",
    "agent-control-models>=7.5.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.entry-points."agent_control.rules"]
"cisco.ai_defense" = "agent_control_rule_cisco.ai_defense:CiscoAIDefenseRule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_rule_cisco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
agent-control-rules = { path = "../../builtin", editable = true }
agent-control-models = { path = "../../../models", editable = true }
